services:
  nginx:
    image: nginx
    container_name: xnat-test-nginx
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - "./config/nginx.conf:/etc/nginx/nginx.conf:ro"
    depends_on:
      - xnat

  xnat-db:
    image: postgres:15.4-alpine
    container_name: xnat-test-db
    restart: always
    environment:
      - POSTGRES_USER=xnat
      - POSTGRES_PASSWORD=xnat-super-secret-password
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - "./data/db:/var/lib/postgresql/data"

  xnat:
    image: registry.gitlab.com/radiology/infrastructure/docker-images/xnat:1.9.3.1
    container_name: xnat-test
    restart: unless-stopped
    environment:
      XNAT_DATA: /xnatdata/
      XNAT_HOME: /xnatdata/home
      XNAT_DB_HOST: xnat-db
      XNAT_DB_NAME: xnat
      XNAT_DB_USERNAME: xnat
      XNAT_DB_PASSWORD: xnat-super-secret-password
      JAVA_OPTS: "-Xms2g -Xmx4g"
    volumes:
      - "./data/xnat:/xnatdata/"
    depends_on:
      - xnat-db
